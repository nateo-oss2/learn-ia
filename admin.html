<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin - CodeLab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f2f4f7;
      color: #1e2229;
      padding: 32px 24px;
    }
    h1 { font-size: 1.6rem; margin-bottom: 24px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab {
      padding: 10px 20px;
      border: 1px solid #e6e9ef;
      border-radius: 8px;
      background: #f9fafc;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.15s;
    }
    .tab:hover { background: #edf0f4; }
    .tab.active { background: #5279f0; color: #fff; border-color: #5279f0; }
    .panel { display: none; }
    .panel.active { display: block; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      font-size: 0.82rem;
    }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #eef1f5; }
    th {
      background: #f8fafc;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #8e96a6;
    }
    tr:hover td { background: #f8fafc; }
    .empty { color: #8e96a6; padding: 40px 0; text-align: center; }
    .error {
      color: #d6453d;
      background: #fef2f2;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge-enter { background: #dcfce7; color: #166534; }
    .badge-exit  { background: #fef3c7; color: #92400e; }
    .badge-heartbeat { background: #dbeafe; color: #1e40af; }
    .login {
      max-width: 340px;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .login input, .login button, .logout {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #e6e9ef;
      font-size: 0.95rem;
    }
    .login button, .logout { background: #5279f0; color: #fff; border: none; font-weight: 600; cursor: pointer; }
    .logout { float: right; padding: 8px 14px; font-size: 0.85rem; }
    .is-hidden { display: none !important; }
    td { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 600px) {
      body { padding: 16px; }
      table { font-size: 0.72rem; }
      th, td { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <h1>👋 Admin — CodeLab <button id="logout" class="logout is-hidden">Se déconnecter</button></h1>
  <div id="error" class="error" style="display:none"></div>
  <form id="login" class="login is-hidden">
    <label for="password"><strong>Mot de passe admin</strong></label>
    <input id="password" type="password" autocomplete="current-password" required />
    <button type="submit">Entrer</button>
  </form>
  <div id="dashboard" class="is-hidden">
  <div class="tabs">
    <button class="tab active" data-tab="visits">Visites</button>
    <button class="tab" data-tab="users">Utilisateurs</button>
  </div>
  <div id="panel-visits" class="panel active"></div>
  <div id="panel-users" class="panel"></div>
  </div>

  <script>
    const panels = { visits: document.getElementById("panel-visits"), users: document.getElementById("panel-users") };

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        Object.entries(panels).forEach(([k, el]) => el.classList.toggle("active", k === btn.dataset.tab));
      });
    });

    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
    const badgeClass = { page_enter: "enter", enter: "enter", page_exit: "exit", exit: "exit", heartbeat: "heartbeat" };
    const loginForm = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const logoutBtn = document.getElementById("logout");

    function showLogin() {
      loginForm.classList.remove("is-hidden");
      dashboard.classList.add("is-hidden");
      logoutBtn.classList.add("is-hidden");
    }

    function hideError() {
      document.getElementById("error").style.display = "none";
    }

    loginForm.addEventListener("submit", async e => {
      e.preventDefault();
      hideError();
      const res = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("password").value })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showError(data.error || "Connexion impossible");
        return;
      }
      loginForm.reset();
      load();
    });

    logoutBtn.addEventListener("click", async () => {
      await fetch("/api/admin/logout", { method: "POST" });
      showLogin();
    });

    function showError(msg) {
      const el = document.getElementById("error");
      el.textContent = msg;
      el.style.display = "block";
    }

    async function load() {
      try {
        const [visitsRes, usersRes] = await Promise.all([fetch("/api/visits"), fetch("/api/users")]);
        if (visitsRes.status === 401 || usersRes.status === 401) {
          showLogin();
          return;
        }
        const visits = await visitsRes.json();
        const users = await usersRes.json();
        loginForm.classList.add("is-hidden");
        dashboard.classList.remove("is-hidden");
        logoutBtn.classList.remove("is-hidden");

        if (visits?.error) {
          showError(visits.error);
          return;
        }

        // Visits table
        if (Array.isArray(visits)) {
          panels.visits.innerHTML = visits.length
            ? `<table><thead><tr>
                <th>Action</th><th>Page</th><th>Durée</th><th>IP</th><th>User</th><th>Date</th>
              </tr></thead><tbody>
              ${visits.map(v => {
                const cls = `badge-${badgeClass[v.action] || "enter"}`;
                const dur = v.duration_seconds ? Math.floor(v.duration_seconds) + "s" : "—";
                const date = v.visited_at ? new Date(v.visited_at).toLocaleString("fr-FR") : "—";
                return `<tr>
                  <td><span class="badge ${cls}">${esc(v.action || "page_enter")}</span></td>
                  <td>${esc(v.page_name || v.page || "—")}</td>
                  <td>${dur}</td>
                  <td>${esc(v.ip || "—")}</td>
                  <td>${esc(v.username || "—")}</td>
                  <td>${date}</td>
                </tr>`;
              }).join("")}</tbody></table>`
            : '<div class="empty">Aucune visite</div>';
        } else {
          panels.visits.innerHTML = '<div class="empty">Aucune donnée</div>';
        }

        // Users table
        const userMap = users && !Array.isArray(users) && !users.error ? users : {};
        const names = Object.keys(userMap);
        panels.users.innerHTML = names.length
          ? `<table><thead><tr>
              <th>Username</th><th>Créé le</th><th>IP</th><th>User-Agent</th><th>Historique</th>
            </tr></thead><tbody>
            ${names.map(n => {
              const u = userMap[n];
              const date = u.created_at ? new Date(u.created_at).toLocaleString("fr-FR") : "—";
              const history = Array.isArray(u.history) && u.history.length ? u.history.map(h =>
                `${h.action} ${new Date(h.time).toLocaleString("fr-FR")}`
              ).join("; ") : "—";
              return `<tr>
                <td><strong>${esc(n)}</strong></td>
                <td>${date}</td>
                <td>${esc(u.ip || "—")}</td>
                <td title="${esc(u.user_agent)}">${u.user_agent ? esc(u.user_agent.slice(0, 40)) + "…" : "—"}</td>
                <td>${esc(history)}</td>
              </tr>`;
            }).join("")}</tbody></table>`
          : '<div class="empty">Aucun utilisateur</div>';
      } catch (e) {
        showError("Impossible de charger les données.");
      }
    }

    load();
  </script>
</body>
</html>
